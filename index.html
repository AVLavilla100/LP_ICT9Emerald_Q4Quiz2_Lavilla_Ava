<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Analyzer</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <style>

    .subject-collage {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
        padding: 10px;
        max-width: 1000px; 
        margin-left: 400px;
    }

    .collage-item {
        border: none;
        padding: 0;
        background: none;
        cursor: pointer;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s ease;
    }

    .collage-item img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
        border-radius: 12px;
    }


    </style>

</head>
<body>

    <div class="container bg-warning rounded p-2 mt-2 ml-auto">
        <h1 style="text-align: center;">Score Analyzer</h1>
    </div>

    <div class="container" style="text-align: center; margin-top: 15px; font-size: 20px;">
        <details ontoggle="message()">
            <summary>Instructions (Click me!)</summary>
        </details>
    </div>

    <div class="subject-collage" style="text-align: center; margin-top: 30px;">
       <div class="collage-item"><img src="sciencedog.jpg" alt="Item 1"><span>Science</span>
            <input id="ScienceInput" type="number" placeholder="Science Grade">
        </div>
       <div class="collage-item"><img src="englishdog.jpg" alt="Item 2"><span>Mathematics</span>
            <input id="MathInput" type="number" placeholder="Math Grade">
        </div>
       <div class="collage-item"><img src="english cat.jpg" alt="Item 3"><span>English</span>
            <input id="EnglishInput" type="number" placeholder="English Grade">
       </div>
        
    </div>

    <div class="container" style="margin: auto; text-align: center; margin-top: 20px;">
        <button class="btn btn-warning rounded btn-lg" type="button" onclick="compute()">Get Rating</button>
    </div>

    <h3 id="result" style="text-align: center;"></h3>
 

    <script>
        function message() {
            alert("Enter your grades in the following subjects.")
        }

        function compute() {
        let rating = parseInt(document.getElementById("ScienceInput").value);
        let rating2 = parseInt(document.getElementById("MathInput").value);
        let rating3 = parseInt(document.getElementById("EnglishInput").value);

        var gpa = ((rating + rating2 + rating3) / 3);
             
        let grade;

        switch (true) {
            case (gpa >= 94 && gpa <= 100):
            grade = "Excellent";
            break;
        case (gpa >= 87 && gpa <= 93.99):
            grade = "Satisfactory";
            break;
        case (gpa >= 80 && gpa <= 86.99):
            grade = "Needs Improvement";
            break;
        case (gpa >= 75 && gpa <= 78.99):
            grade = "Poor";
            break;
        case (gpa >= 70 && gpa <= 74.99):
            grade = "Poor";
            break;
        default:
            grade = "Invalid Input";
    }

        document.getElementById("result").innerHTML="Your score is:" + " " + gpa.toFixed(2) +  " | " + grade;

    }

    
    </script>




</body>
</html>
